[package]
name = "nanofm"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "=0.2.2"
chrono = "0.4"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
futures = "0.3"
imagesize = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError", "NSData", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSImage", "NSImageRep", "NSGraphicsContext", "NSBitmapImageRep", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGImage"] }

[dev-dependencies]
tempfile = "3"
gpui = { version = "=0.2.2", features = ["test-support"] }
